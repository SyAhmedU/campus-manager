<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMET LeetCode Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: white; padding: 30px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 2.5em; margin-bottom: 10px; }
        .live { display: flex; gap: 10px; color: #666; font-size: 0.95em; align-items: center; }
        .dot { width: 12px; height: 12px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .value { font-size: 2em; color: #667eea; font-weight: bold; margin: 10px 0; }
        .label { color: #999; font-size: 0.9em; text-transform: uppercase; }
        .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .chart { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .chart h3 { margin-bottom: 20px; color: #333; }
        .table-box { background: white; padding: 20px; border-radius: 12px; overflow-x: auto; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f0f0f0; padding: 15px; text-align: left; border-bottom: 2px solid #e5e7eb; }
        td { padding: 15px; border-bottom: 1px solid #f3f4f6; }
        tr:hover { background: #f9fafb; }
        .rank { display: inline-block; background: #667eea; color: white; width: 35px; height: 35px; border-radius: 50%; line-height: 35px; text-align: center; font-weight: bold; }
        .easy { background: #dbeafe; color: #0284c7; padding: 5px 10px; border-radius: 5px; font-weight: 600; }
        .medium { background: #fef3c7; color: #b45309; padding: 5px 10px; border-radius: 5px; font-weight: 600; }
        .hard { background: #fee2e2; color: #dc2626; padding: 5px 10px; border-radius: 5px; font-weight: 600; }
        @media (max-width: 768px) { .charts { grid-template-columns: 1fr; } h1 { font-size: 1.8em; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 AMET LeetCode Dashboard</h1>
            <div class="live"><div class="dot"></div><span>Live Data - Last updated now</span></div>
        </header>
        
        <div class="metrics">
            <div class="card"><div class="label">Total Students</div><div class="value" id="total">6</div></div>
            <div class="card"><div class="label">Average Solved</div><div class="value" id="avg">80</div></div>
            <div class="card"><div class="label">Top Performer</div><div class="value" id="top" style="font-size: 1.5em;">Rohan</div></div>
            <div class="card"><div class="label">Total Easy</div><div class="value" id="easy">255</div></div>
        </div>
        
        <div class="charts">
            <div class="chart"><h3>Problems Solved</h3><canvas id="bar"></canvas></div>
            <div class="chart"><h3>Difficulty Mix</h3><canvas id="pie"></canvas></div>
        </div>
        
        <div class="table-box">
            <h2 style="margin-bottom: 20px;">Leaderboard</h2>
            <table>
                <thead><tr><th>Rank</th><th>Name</th><th>Easy</th><th>Medium</th><th>Hard</th><th>Total</th></tr></thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>
    
    <script>
        const data = [
            { name: 'Rohan Patel', easy: 52, medium: 35, hard: 18, total: 105 },
            { name: 'Vikram Desai', easy: 48, medium: 31, hard: 14, total: 93 },
            { name: 'Arun Kumar', easy: 45, medium: 28, hard: 12, total: 85 },
            { name: 'Sneha Roy', easy: 42, medium: 25, hard: 10, total: 77 },
            { name: 'Priya Singh', easy: 38, medium: 22, hard: 8, total: 68 },
            { name: 'Neha Sharma', easy: 30, medium: 15, hard: 5, total: 50 }
        ].sort((a, b) => b.total - a.total);
        
        document.getElementById('total').innerHTML = data.length;
        document.getElementById('avg').innerHTML = Math.round(data.reduce((s, d) => s + d.total, 0) / data.length);
        document.getElementById('top').innerHTML = data[0].name.split(' ')[0];
        document.getElementById('easy').innerHTML = data.reduce((s, d) => s + d.easy, 0);
        
        document.getElementById('list').innerHTML = data.map((s, i) => `
            <tr>
                <td><span class="rank">${i + 1}</span></td>
                <td><b>${s.name}</b></td>
                <td><span class="easy">${s.easy}</span></td>
                <td><span class="medium">${s.medium}</span></td>
                <td><span class="hard">${s.hard}</span></td>
                <td><b>${s.total}</b></td>
            </tr>
        `).join('');
        
        new Chart(document.getElementById('bar'), {
            type: 'bar',
            data: {
                labels: data.map(d => d.name.split(' ')[0]),
                datasets: [
                    { label: 'Easy', data: data.map(d => d.easy), backgroundColor: '#0284c7' },
                    { label: 'Medium', data: data.map(d => d.medium), backgroundColor: '#b45309' },
                    { label: 'Hard', data: data.map(d => d.hard), backgroundColor: '#dc2626' }
                ]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });
        
        new Chart(document.getElementById('pie'), {
            type: 'doughnut',
            data: {
                labels: ['Easy', 'Medium', 'Hard'],
                datasets: [{
                    data: [
                        data.reduce((s, d) => s + d.easy, 0),
                        data.reduce((s, d) => s + d.medium, 0),
                        data.reduce((s, d) => s + d.hard, 0)
                    ],
                    backgroundColor: ['#0284c7', '#b45309', '#dc2626']
                }]
            },
            options: { responsive: true }
        });
    </script>
</body>
</html>
